<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Membuka WhatsApp…</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --burgundy: #580e1d; --olive: #566348; --ivory: #fbf8f3; --ink: #2c1c1e; color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ivory); color: var(--ink); font: 15px/1.6 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 14px; background: var(--olive); color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 600; }
  small { display: block; margin-top: 12px; color: #766466; }
</style>
</head>
<body>
<main>
  <p>Membuka WhatsApp untuk mengirim undangan<br><b id="who"></b></p>
  <a id="go" href="#">Buka WhatsApp</a>
  <small>Jika WhatsApp tidak terbuka otomatis, tekan tombol di atas.</small>
</main>
<script>
const BASE = location.origin + location.pathname.replace(/wa(\.html)?$/, "");
const MSG = `Assalamu'alaikum Warahmatullahi Wabarakatuh

Kepada Yth.
Bapak/Ibu/Saudara/i {nama}

Dengan segala kerendahan hati, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk hadir dan memberikan doa restu pada acara pernikahan kami:

*Alya & Rafa*

🗓️ Minggu, 27 Desember 2026
📍 Villa Roseraie, Cisarua, Bogor

Tautan undangan lengkap:
{link}

Terima kasih atas perhatian dan doa restunya.
Wassalamu'alaikum Warahmatullahi Wabarakatuh`;

const q = new URLSearchParams(location.search);
const name = (q.get("to") || "").trim().slice(0, 80);
let num = (q.get("n") || "").replace(/\D/g, "");
if (num.startsWith("0")) num = "62" + num.slice(1); else if (num.startsWith("8")) num = "62" + num;
const link = BASE + (name ? "?to=" + encodeURIComponent(name).replace(/%20/g, "+") : "");
const text = MSG.replaceAll("{nama}", name || "Bapak/Ibu/Saudara/i").replaceAll("{link}", link);
const url = (num ? "https://wa.me/" + num : "https://wa.me/") + "?text=" + encodeURIComponent(text);
document.getElementById("who").textContent = name || "Tamu Undangan";
document.getElementById("go").href = url;
location.replace(url);
</script>
</body>
</html>
